name: Feature request
description: Suggest an idea or improvement for PolyHarness
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before filing, please skim the
        [roadmap](../blob/main/docs/development/roadmap.md) — your idea may
        already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: "When optimizing a harness for ..., I can't ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like PolyHarness to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search loop / orchestrator
        - Proposer backends / adapters
        - Evaluator / scoring
        - CLI / UX
        - Online evolution (ph wrap / ph evolve)
        - Benchmarking / metrics
        - Docs
        - Other
    validations:
      required: true
