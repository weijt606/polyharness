name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check npm wrapper syntax
        run: |
          node --check bin/ph.mjs
          node --check bin/postinstall.mjs
      - name: Build and verify wheel
        run: |
          pip install build
          rm -rf dist/
          python -m build
          pip install dist/*.whl
          ph --version
          python - <<'EOF'
          import polyharness, pathlib
          pkg = pathlib.Path(polyharness.__file__).parent
          templates = list((pkg / "templates").rglob("evaluate.py"))
          assert templates, "templates missing from wheel"
          print(f"OK: {len(templates)} templates bundled")
          EOF
