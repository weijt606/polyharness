name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # OIDC: required for npm trusted publishing (no stored token)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url — it writes an .npmrc whose empty _authToken shadows OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag matches package.json + wrapper syntax
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          PY_VERSION="$(grep -Eo '__version__ = "[^"]+"' src/polyharness/__init__.py | cut -d'"' -f2)"
          echo "tag=$TAG_VERSION npm=$NPM_VERSION python=$PY_VERSION"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ] || [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: tag v$TAG_VERSION vs package.json $NPM_VERSION vs __init__.py $PY_VERSION"
            exit 1
          fi
          node --check bin/ph.mjs
          node --check bin/postinstall.mjs

      # Upgrade + publish in ONE step so the publish definitely uses the new npm
      # (trusted publishing needs npm >= 11.5.1). Diagnostics confirm the setup.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm -v)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC: id-token IS available"
          else
            echo "OIDC: id-token MISSING — check 'id-token: write' and repo Actions settings"
          fi
          npm publish
