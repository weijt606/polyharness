[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyharness"
version = "0.2.2"
description = "Automated harness optimization for AI agents — make your agent evolve."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "weijt606" },
]
keywords = ["agent", "harness", "optimization", "meta-harness", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ph = "polyharness.cli:main"

[project.urls]
Homepage = "https://github.com/weijt606/polyharness"
Repository = "https://github.com/weijt606/polyharness"
Issues = "https://github.com/weijt606/polyharness/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyharness = ["templates/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
